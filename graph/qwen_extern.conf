#
# Extra actsim configuration, passed with -cnf.
# string_tablex appends to the library list already declared by actsim.
# ${QWEN_BRIDGE_LIB} is expanded by the ACT config reader.
#
begin sim
    begin extern
        string_tablex libs "qwen_bridge"
        begin qwen_bridge
            string path "${QWEN_BRIDGE_LIB}"
            string qwen::init "qwen_f_init"
            string qwen::source_prompt "qwen_f_source_prompt"
            string qwen::source_layer "qwen_f_source_layer"
            string qwen::fork "qwen_f_fork"
            string qwen::compute1 "qwen_f_compute1"
            string qwen::compute2 "qwen_f_compute2"
            string qwen::commit "qwen_f_commit"
            string qwen::finish_layer "qwen_f_finish_layer"
            string qwen::continue_after "qwen_f_continue_after"
            string qwen::decode_input "qwen_f_decode_input"
            string qwen::finish_generate "qwen_f_finish_generate"
        end
    end
end
